[versions]
accompanistPermissions = "0.37.3"
activityComposeVersion = "1.13.0"
agp = "9.3.2"
appcompat = "1.8.0"
composeBomVersion = "2026.08.00"
composeRuntimeVersion = "1.12.0"
coreKtx = "1.19.0"
desugarVersion = "2.1.5"
espressoCore = "3.7.0"
gmsTasksVersion = "18.4.1"
guavaVersion = "33.7.1-android"
junit = "4.13.2"
junitVersion = "1.3.0"
kotlinComposePluginVersion = "2.4.10"
material = "1.14.0"
timber = "5.0.1"

[libraries]
accompanistPermissions = { module = "com.google.accompanist:accompanist-permissions", version.ref = "accompanistPermissions" }
activityComposeLib = { module = "androidx.activity:activity-compose", version.ref = "activityComposeVersion" }
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
composeRuntimeLib = { module = "androidx.compose.runtime:runtime", version.ref = "composeRuntimeVersion"}
desugarLib = { module = "com.android.tools:desugar_jdk_libs_nio", version.ref = "desugarVersion" }
gmsTasks = { module = "com.google.android.gms:play-services-tasks", version.ref = "gmsTasksVersion" }
guavaLib = { module = "com.google.guava:guava", version.ref = "guavaVersion" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
material = { group = "com.google.android.material", name = "material", version.ref = "material" }
timber = { module = "com.jakewharton.timber:timber", version.ref = "timber" }

composeBomLib = { module = "androidx.compose:compose-bom", version.ref = "composeBomVersion" }
material3Lib = { module = "androidx.compose.material3:material3" }
uiToolingPreviewLib = { module = "androidx.compose.ui:ui-tooling-preview" }
uiToolingLib = { module = "androidx.compose.ui:ui-tooling" }

[plugins]
androidLibrary = { id = "com.android.library", version.ref = "agp" }
kotlinComposePlugin = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlinComposePluginVersion" }

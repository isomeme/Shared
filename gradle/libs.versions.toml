[versions]
agp = "9.3.1"
appcompat = "1.8.0"
composeRuntimeVersion = "1.12.0"
coreKtx = "1.19.0"
desugarVersion = "2.1.5"
espressoCore = "3.7.0"
junit = "4.13.2"
junitVersion = "1.3.0"
kotlinComposePluginVersion = "2.4.10"
material = "1.14.0"

[libraries]
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
composeRuntimeLib = { module = "androidx.compose.runtime:runtime", version.ref = "composeRuntimeVersion"}
desugarLib = { module = "com.android.tools:desugar_jdk_libs_nio", version.ref = "desugarVersion" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
material = { group = "com.google.android.material", name = "material", version.ref = "material" }

[plugins]
androidLibrary = { id = "com.android.library", version.ref = "agp" }
kotlinComposePlugin = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlinComposePluginVersion" }
